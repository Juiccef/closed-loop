AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Closed Loop: daily check-ins that close the loop. Self-hosted MCP server (Streamable HTTP) for an
  Alexa+ add-on, caregiver console, simulated Alexa+ client. Reminders and check-ins only; not an
  emergency alert system.

Parameters:
  AdminToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Access code for the console, simulator, and demo admin endpoints.
  McpBearerToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Static bearer token for MCP clients (stand-in for OAuth 2.1, which is out of scope).
  AckLinkSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC secret for signed acknowledge links.
  SesSender:
    Type: String
    Description: Verified SES identity used as the From address.
  SeedL1Email:
    Type: String
    Description: Demo first contact (must be verified while SES is in the sandbox).
  SeedL2Email:
    Type: String
    Description: Demo second contact (must be verified while SES is in the sandbox).
  OAuthSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC secret for OAuth access tokens (JWT, HS256).
  AlexaClientSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Client secret for the statically registered Alexa+ OAuth client (client_id alexa-plus).
  AlexaRedirectUris:
    Type: String
    Default: ''
    Description: Comma-separated redirect URIs shown by `alexa-ai configure-account-linking` (exact match).
  BedrockModelId:
    Type: String
    Default: ''
    Description: Bedrock model or inference profile for the planner. Empty means the rules planner.
  AlexaSkillId:
    Type: String
    Default: ''
    Description: >-
      Skill ID of the classic Alexa custom skill for a real Echo (developer console, Copy Skill ID). Empty means
      no skill function.

Conditions:
  HasBedrock: !Not [!Equals [!Ref BedrockModelId, '']]
  HasAlexaSkill: !Not [!Equals [!Ref AlexaSkillId, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Handler: index.lambdaHandler
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        SES_SENDER: !Ref SesSender
        ACK_LINK_SECRET: !Ref AckLinkSecret
        NODE_OPTIONS: --enable-source-maps

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      StreamSpecification: { StreamViewType: NEW_IMAGE }
      SSESpecification: { SSEEnabled: true }

  # MCP endpoint, console API, acknowledge links, and static pages on one Function URL.
  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: MCP server (/mcp), caregiver console API, ack links, static pages
      CodeUri: ../dist/web/
      MemorySize: 2048
      Timeout: 15
      Environment:
        Variables:
          ADMIN_TOKEN: !Ref AdminToken
          MCP_BEARER_TOKEN: !Ref McpBearerToken
          SEED_L1_EMAIL: !Ref SeedL1Email
          SEED_L2_EMAIL: !Ref SeedL2Email
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          OAUTH_SIGNING_SECRET: !Ref OAuthSigningSecret
          ALEXA_CLIENT_SECRET: !Ref AlexaClientSecret
          ALEXA_REDIRECT_URIS: !Ref AlexaRedirectUris
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
        - !If
          - HasBedrock
          - Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
          - !Ref AWS::NoValue
      FunctionUrlConfig:
        AuthType: NONE
      Events:
        KeepWarm:
          Type: ScheduleV2
          Properties:
            Name: !Sub ${AWS::StackName}-keep-warm
            Description: Keeps one instance warm so MCP calls stay under 500 ms (no provisioned concurrency on new accounts)
            ScheduleExpression: rate(5 minutes)
            Input: '{"source":"closed-loop.keep-warm"}'
            RetryPolicy: { MaximumRetryAttempts: 0 }

  # Closes check-in windows and emails family. Cannot speak to the person.
  TickFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Every minute - close windows, run the escalation ladder, send SES email
      CodeUri: ../dist/tick/
      MemorySize: 1024
      Timeout: 50
      Environment:
        Variables:
          WEB_URL: !GetAtt WebFunctionUrl.FunctionUrl
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Events:
        Tick:
          Type: ScheduleV2
          Properties:
            Name: !Sub ${AWS::StackName}-tick
            Description: Closed Loop tick (window close, ladder, email)
            ScheduleExpression: rate(1 minute)
            RetryPolicy: { MaximumRetryAttempts: 0 }

  # Second opinion on what the person said, off the hot path: DynamoDB Streams -> Lambda -> Bedrock.
  ClassifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Async Bedrock review of new utterances; can only move a record toward caution
      CodeUri: ../dist/classifier/
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - !If
          - HasBedrock
          - Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
          - !Ref AWS::NoValue
      Events:
        Utterances:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Table.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"SK":{"S":[{"prefix":"UTT#"}]}}}}'

  # Classic Alexa custom skill (development stage, the developer's own Echo): a thin MCP client of WebFunction's
  # /mcp for the shared demo household. Not an Alexa+ add-on (that tooling is partner-only). Only Alexa can invoke
  # it, and only for this skill ID (the trigger here, and a check in code).
  SkillFunction:
    Type: AWS::Serverless::Function
    Condition: HasAlexaSkill
    Properties:
      FunctionName: !Sub ${AWS::StackName}-alexa-skill
      Description: Classic Alexa skill for a real Echo - calls the Closed Loop MCP server (not an Alexa+ add-on)
      CodeUri: ../dist/skill/
      MemorySize: 1024
      Timeout: 8
      Environment:
        Variables:
          ALEXA_SKILL_ID: !Ref AlexaSkillId
          MCP_URL: !Sub '${WebFunctionUrl.FunctionUrl}mcp'
          MCP_BEARER_TOKEN: !Ref McpBearerToken
      Events:
        Alexa:
          Type: AlexaSkill
          Properties:
            SkillId: !Ref AlexaSkillId

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WebFunction}
      RetentionInDays: 7
  TickLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TickFunction}
      RetentionInDays: 7
  ClassifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ClassifierFunction}
      RetentionInDays: 7
  SkillLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasAlexaSkill
    Properties:
      LogGroupName: !Sub /aws/lambda/${SkillFunction}
      RetentionInDays: 7

Outputs:
  WebUrl:
    Description: Simulator at /simulator/, console at /console/, MCP at /mcp
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  McpUrl:
    Value: !Sub '${WebFunctionUrl.FunctionUrl}mcp'
  TableName:
    Value: !Ref Table
  WebFunctionName:
    Value: !Ref WebFunction
  TickFunctionName:
    Value: !Ref TickFunction
  SkillFunctionArn:
    Condition: HasAlexaSkill
    Description: Alexa developer console, Build > Endpoint > AWS Lambda ARN > Default Region
    Value: !GetAtt SkillFunction.Arn
