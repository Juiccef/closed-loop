<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Linked</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <style>
      main { max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Finishing sign-in…</h1>
      <p id="msg">Returning to the simulator.</p>
    </main>
    <script type="module">
      // OAuth redirect target for the simulator (a public client). Hands the code back to the opener, same origin only.
      const q = new URLSearchParams(location.search);
      const payload = { type: 'closed-loop-oauth', code: q.get('code'), state: q.get('state'), error: q.get('error'), errorDescription: q.get('error_description') };
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(payload, location.origin);
        document.getElementById('title').textContent = payload.error ? 'Linking cancelled' : 'Linked';
        document.getElementById('msg').textContent = 'You can close this window.';
        setTimeout(() => window.close(), 800);
      } else {
        // No popup (blocked, or opened in the same tab): hand the result over through session storage.
        try {
          sessionStorage.setItem('closed-loop-oauth-result', JSON.stringify(payload));
        } catch {}
        location.replace('/simulator/');
      }
    </script>
  </body>
</html>
